name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'version'
      - 'Taskfile.yml'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'chart/**'
      - 'version'
      - 'Taskfile.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Lint Chart
        run: task lint

      - name: Test Build Package
        run: task build

      - name: Test Template Rendering
        run: task template
