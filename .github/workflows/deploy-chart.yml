name: Release Helm Chart (OCI)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-chart.yml'
      - 'chart/**'
      - 'version'
      - 'Taskfile.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Lint Chart
        run: task lint

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | task login OWNER="${{ github.actor }}" -- --password-stdin

      - name: Publish OCI Chart to GHCR
        run: task publish OWNER="${{ github.repository_owner }}"
