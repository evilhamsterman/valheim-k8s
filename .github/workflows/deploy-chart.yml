name: Release Helm Chart (OCI)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Set up Task
        uses: go-task/setup-task@v2
        with:
          version: 3.x

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | task login OWNER="${{ github.actor }}" -- --password-stdin

      - name: Publish OCI Chart to GHCR
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          if [ -n "${VERSION}" ]; then
            task publish OWNER="${{ github.repository_owner }}" VERSION="${VERSION}"
          else
            task publish OWNER="${{ github.repository_owner }}"
          fi
