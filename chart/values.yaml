# World and server configuration
worldName: example-world-name
serverName: example-server-name
password: password
# Set passwordSecret to use an existing Kubernetes secret instead of plain text password.
# The secret must contain a key named 'password'.
# passwordSecret: my-valheim-secret
serverPublic: true
# Additional command line arguments to pass to the Valheim server
# serverArgs: ""

image:
  repository: ghcr.io/community-valheim-tools/valheim-server
  tag: latest
  pullPolicy: IfNotPresent

storage:
  # World save files, admin/ban lists, and preferences (mounted to /config)
  data:
    kind: persistentVolumeClaim
    pvc:
      size: 2Gi
      # storageClassName: ""
      # existingClaim: ""
      accessModes:
        - ReadWriteOnce
      # annotations: {}
      # labels: {}
    hostvol:
      path: /data/valheim

  # Server installation files and Steam depot cache (mounted to /opt/valheim)
  server:
    kind: persistentVolumeClaim
    pvc:
      size: 10Gi
      # storageClassName: ""
      # existingClaim: ""
      accessModes:
        - ReadWriteOnce
      # annotations: {}
      # labels: {}
    hostvol:
      path: /data/valheim-server

# Built-in backup management options from upstream container
backups:
  # Enable periodic automatic world backups and dedicated backup storage
  enabled: true
  # Cron expression for backup schedule (default: hourly at 5 past the hour)
  cron: "5 * * * *"
  # Directory where backups are written in the container
  directory: "/config/backups"
  # Purge backups older than this number of days (default: 3)
  maxAge: 3
  # Maximum number of backups to retain (0 = unlimited, still constrained by maxAge)
  maxCount: 0
  # Perform backups even if no players are currently connected
  ifIdle: true
  # Grace period (seconds) after last player disconnects to still trigger backups (when ifIdle is false)
  idleGracePeriod: 3600
  # Compress backups into zip archives (false stores uncompressed directory)
  zip: true
  # Command executed before creating backup (@BACKUP_FILE@ placeholder substituted)
  preBackupHook: ""
  # Command executed after creating backup (@BACKUP_FILE@ placeholder substituted)
  # Example: "timeout 300 scp -i /extraVolumes/backup-ssh-key/ssh-key -o StrictHostKeyChecking=no @BACKUP_FILE@ user@host:/backups/$(basename @BACKUP_FILE@)"
  postBackupHook: ""

  # Dedicated volume for world backups (mounted to /config/backups or backups.directory)
  # Required when backups.enabled is true.
  storage:
    kind: persistentVolumeClaim
    pvc:
      size: 10Gi
      # storageClassName: ""
      # existingClaim: ""
      accessModes:
        - ReadWriteOnce
      # annotations: {}
      # labels: {}
    hostvol:
      path: /data/valheim-backups

# If useHostNetworking is true, pod uses host network namespace and no Service is created
useHostNetworking: false

networking:
  serviceType: LoadBalancer
  # Specify load balancer class implementation (e.g., 'tailscale', 'io.cilium/node', etc.)
  # loadBalancerClass: ""
  # Optional static IP for LoadBalancer service
  # loadBalancerIP: ""
  # Traffic policy ('Local' or 'Cluster')
  # externalTrafficPolicy: Local
  gamePort: 2456
  publishQueryPort: true
  nodePort: 30373
  # Optional additional service annotations and labels
  serviceAnnotations: {}
  serviceLabels: {}

resources: {}
  # limits:
  #   cpu: 4000m
  #   memory: 8Gi
  # requests:
  #   cpu: 2000m
  #   memory: 4Gi

# Readiness probe verifies that the game server is listening and ready to accept connections
readinessProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - test "$(cat /var/run/valheim/valheim-server.status 2>/dev/null)" = "running"
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

# Startup probe gives the server time to download files and load chunks before liveness/readiness kicks in
startupProbe:
  exec:
    command:
      - /bin/sh
      - -c
      - test "$(cat /var/run/valheim/valheim-server.status 2>/dev/null)" = "running"
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe: {}

nodeSelector: {}
tolerations: []
affinity: {}
securityContext: {}

# Optional pod labels and annotations
podLabels: {}
podAnnotations: {}

# priorityClassName: high-priority

# Additional environment variables passed to the container
# extraEnvironmentVars:
#   SUPERVISOR_HTTP: "true"
#   SUPERVISOR_HTTP_PASS: "secret"

# Extra volumes to mount (e.g., secrets for backup SSH keys, custom configs)
# extraVolumes:
#   - name: backup-ssh-key
#     type: secret
#     defaultMode: 0600
#     mountPath: /extraVolumes/backup-ssh-key
