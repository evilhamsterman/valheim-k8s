{{- if and .Values.storage.data (eq .Values.storage.data.kind "persistentVolumeClaim") (not .Values.storage.data.pvc.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-world-data
  namespace: {{ .Release.Namespace }}
  {{- with .Values.storage.data.pvc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.storage.data.pvc.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.storage.data.pvc.storageClassName }}
  storageClassName: {{ .Values.storage.data.pvc.storageClassName | quote }}
  {{- end }}
  accessModes:
    {{- toYaml (default (list "ReadWriteOnce") .Values.storage.data.pvc.accessModes) | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.storage.data.pvc.size }}
{{- end }}
{{- if and .Values.storage.server (eq .Values.storage.server.kind "persistentVolumeClaim") (not .Values.storage.server.pvc.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
