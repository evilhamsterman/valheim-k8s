spec:
  {{- if .Values.storage.server.pvc.storageClassName }}
  storageClassName: {{ .Values.storage.server.pvc.storageClassName | quote }}
  {{- end }}
  accessModes:
    {{- toYaml (default (list "ReadWriteOnce") .Values.storage.server.pvc.accessModes) | nindent 4 }}
