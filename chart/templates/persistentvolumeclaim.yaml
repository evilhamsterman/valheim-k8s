{{- end }}
{{- if and .Values.storage.backups (ne .Values.storage.backups.enabled false) (eq .Values.storage.backups.kind "persistentVolumeClaim") (not .Values.storage.backups.pvc.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-backup-data
  namespace: {{ .Release.Namespace }}
  {{- with .Values.storage.backups.pvc.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.storage.backups.pvc.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.storage.backups.pvc.storageClassName }}
  storageClassName: {{ .Values.storage.backups.pvc.storageClassName | quote }}
  {{- end }}
  accessModes:
    {{- toYaml (default (list "ReadWriteOnce") .Values.storage.backups.pvc.accessModes) | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.storage.backups.pvc.size }}
{{- end }}
