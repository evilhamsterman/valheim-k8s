{{ if eq .Values.storage.data.kind "persistentVolumeClaim" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-world-data
  namespace: {{ .Release.Namespace }}
spec:
  {{ if .Values.storage.data.pvc.storageClassName }}
  storageClassName: {{ .Values.storage.data.pvc.storageClassName }}
  {{ end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.data.pvc.size }}
{{ end }}
---
{{ if eq .Values.storage.server.kind "persistentVolumeClaim" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-server-base-data
  namespace: {{ .Release.Namespace }}
spec:
  {{ if .Values.storage.server.pvc.storageClassName }}
  storageClassName: {{ .Values.storage.server.pvc.storageClassName }}
  {{ end }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.server.pvc.size }}
{{ end }}
---
{{ if eq .Values.storage.backups.kind "persistentVolumeClaim" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-server-base-data
  namespace: {{ .Release.Namespace }}
spec:
  {{ if .Values.storage.backups.pvc.storageClassName }}
